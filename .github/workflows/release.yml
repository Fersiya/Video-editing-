name: Release installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (без v), например 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ github.event.inputs.version }}' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Assemble build folder (embedded Python + app + ffmpeg)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory build, build\python, build\bin | Out-Null

          # Python 3.12 embeddable
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip -OutFile py.zip
          Expand-Archive py.zip build\python
          $pth = Get-ChildItem build\python\python*._pth | Select-Object -First 1
          $zipname = (Get-ChildItem build\python\python*.zip | Select-Object -First 1).Name
          Set-Content $pth.FullName "$zipname`n.`n..`nLib\site-packages`nimport site"

          # pip + зависимости приложения
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          build\python\python.exe get-pip.py --no-warn-script-location
          build\python\python.exe -m pip install --no-warn-script-location -r requirements.txt

          # приложение
          Copy-Item app build\app -Recurse
          Copy-Item web build\web -Recurse
          Get-ChildItem build -Recurse -Directory -Filter __pycache__ -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

          # ffmpeg + ffprobe
          try {
            Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          } catch {
            Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ff.zip
          }
          Expand-Archive ff.zip ff
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination build\bin
          Get-ChildItem build\bin

      - name: Smoke test (server starts from the embedded Python)
        shell: pwsh
        run: |
          $p = Start-Process build\python\python.exe -ArgumentList '-m','app','--no-browser' -WorkingDirectory build -PassThru -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          Start-Sleep 7
          try {
            $r = Invoke-RestMethod http://127.0.0.1:8765/api/state
            "state: $($r | ConvertTo-Json -Compress)"
            if (-not $r.ffmpeg) { throw 'ffmpeg not found by the app' }
          } finally {
            Stop-Process $p -Force -ErrorAction SilentlyContinue
            Get-Content err.txt, out.txt -ErrorAction SilentlyContinue
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\montage-sorter.iss "/DAppVersion=${{ steps.ver.outputs.version }}"
          Get-ChildItem Output

      - uses: actions/upload-artifact@v4
        with:
          name: MontageSorter-Setup
          path: Output/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Output/*.exe
          generate_release_notes: true
